AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Template for Lambda Sample.
Parameters:
  EnvName:
    Description: Name of an environment. 'dev', 'staging', 'prod' and any name.
    Type: String
    AllowedPattern: ^.*[^0-9]$
    ConstraintDescription: Must end with non-numeric character.
  LambdaHandlerPath:
    Description: Path of a Lambda Handler.
    Type: String
    Default: src/lambda.handler
Resources:
  GithubGrannyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: github-granny-table-${EnvName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  GithubGrannyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: github-granny-bucket-${EnvName}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
        - Id: ExpireOldVersions
          Status: Enabled
          NoncurrentVersionExpirationInDays: 30
  GithubGrannyOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: github-granny-oac-${EnvName}
        Description: OAC for Github Granny S3 bucket.
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3
  GithubGrannyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: GithubGrannyBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${GithubGrannyBucket}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${GGDistribution}
  GGDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
        - Id: S3Origin
          DomainName:
            Fn::GetAtt:
            - GithubGrannyBucket
            - RegionalDomainName
          S3OriginConfig: {}
          OriginAccessControlId:
            Ref: GithubGrannyOAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          ForwardedValues:
            QueryString: false
        PriceClass: PriceClass_100
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: lambdaRole-${EnvName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Path: /
      Policies:
      - PolicyName: SecretsManagerAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-2:018478818543:secret:PAT-0vBP3t
  LambdaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/lambda.ts
        Target: node22
      SamResourceId: LambdaFunction
      guard:
        SuppressedRules:
        - LAMBDA_INSIDE_VPC
    Properties:
      FunctionName:
        Fn::Sub: lambda-function-${EnvName}
      Description: LambdaFunction using  nodejs22.x.
      Runtime: nodejs22.x
      CodeUri: LambdaFunction
      Handler: lambda.handler
      Environment:
        Variables:
          ENV:
            Ref: EnvName
          TZ: UTC
          GITHUB_SECRET_ARN: arn:aws:secretsmanager:us-east-2:018478818543:secret:PAT-0vBP3t
      FunctionUrlConfig:
        AuthType: NONE
      MemorySize: 128
      Timeout: 10
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
  GithubGrannyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/lambda-function-${EnvName}
      RetentionInDays: 30
  GithubGrannyLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: github-granny-lambda-errors-${EnvName}
      AlarmDescription: Lambda error alarm
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: LambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  CloudFront5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: github-granny-cloudfront-5xx-${EnvName}
      AlarmDescription: Alarm for cloudfront 5xx errors
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
      - Name: DistributionId
        Value:
          Ref: GGDistribution
      - Name: Region
        Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  CloudFront4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: github-granny-cloudfront-4xx-${EnvName}
      AlarmDescription: Alarm when CloudFront returns 4xx errors.
      Namespace: AWS/CloudFront
      MetricName: 4xxErrorRate
      Dimensions:
      - Name: DistributionId
        Value:
          Ref: GGDistribution
      - Name: Region
        Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  GithubGrannyDynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: github-granny-dynamodb-throttles-${EnvName}
      AlarmDescription: Alarm when DynamoDB requests are throttled.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
      - Name: TableName
        Value:
          Ref: GithubGrannyTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
