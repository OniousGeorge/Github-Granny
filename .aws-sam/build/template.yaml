AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Template for Lambda Sample.
Parameters:
  EnvName:
    Description: Name of an environment. 'dev', 'staging', 'prod' and any name.
    Type: String
    AllowedPattern: ^.*[^0-9]$
    ConstraintDescription: Must end with non-numeric character.
  LambdaHandlerPath:
    Description: Path of a Lambda Handler.
    Type: String
    Default: src/lambda.handler
Resources:
  GithubPATSecret:
    Type: AWS::SectretsManager::Secret
    Properties:
      Name:
        Fn::sub: github-PAT-${EnvName}
      Description: Github Personal Access Token for Lambda function.
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: lambdaRole-${EnvName}
      AssumeRolePolicyDocument:
        Statement:
        - Action:
          - sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
        Version: '2012-10-17'
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Path: /
  LambdaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/lambda.ts
        Target: node22
      SamResourceId: LambdaFunction
      guard:
        SuppressedRules:
        - LAMBDA_INSIDE_VPC
    Properties:
      FunctionName:
        Fn::Sub: lambda-function-${EnvName}
      Description: LambdaFunction using  nodejs22.x.
      Runtime: nodejs22.x
      CodeUri: LambdaFunction
      Handler: LambdaHandlerPath
      FunctionUrlConfig:
        AuthType: NONE
      MemorySize: 128
      Timeout: 10
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      Environment:
        Variables:
          ENV:
            Ref: EnvName
          TZ: UTC
Outputs:
  LambdaRoleARN:
    Description: Role for Lambda execution.
    Value:
      Fn::GetAtt:
      - LambdaRole
      - Arn
    Export:
      Name:
        Fn::Sub: Github-Granny-LambdaRole-${EnvName}
  LambdaFunctionName:
    Value:
      Ref: LambdaFunction
  LambdaFunctionARN:
    Description: Lambda function ARN.
    Value:
      Fn::GetAtt:
      - LambdaFunction
      - Arn
    Export:
      Name:
        Fn::Sub: Github-Granny-LambdaARN-${EnvName}
